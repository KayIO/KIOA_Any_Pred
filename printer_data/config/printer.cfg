####
## 
## IMPORTANT:
##
## Before doing ANYTHING with the printer, if this is a new board install, you must verify that you are using the same pin's as me for motors and end-stops.
##
## If you feel unsure about ANYTHING do slow down all speeds in this configuration to something low like 5-10mm/s until you have completed the initial
## delta calibration.
##
## Before doing any homing and such you MUST verify that your end-stop sensors are correctly setup. 
## 
## Be ready to turn off the power to the printer during all initial calibration if it behaves in any other way that what you expect!!!
##
## During initial setup the printer will move the hotend in wierd angles above the bed so make sure ALL config gives enough clerance for moves.
## I recommend a MINIMUM of 50mm!
##
## I assume you are using a PID capable bed!!!
##
## I assume you will take care of calibrating how much power the motors should get.
##
## I recommend you to perform the advanced delta-calibration AFTER you have completed the following:
## - initial delta-calibration
##
## - Bed mesh-leveling
##
## - Initial hotend-probe calibration.
##
## - extruder e-step calibration
##
## - pid-tuning of bed AND hotend
##
## - Flow calibration of the filament you use during this setup (PLA is recommended).. You want to make
##   sure your X and Y dimentions are as close as possible.
##   0.02-0.04mm over 20mm on X/Y is easily doable with initial calibration if careful... Z may have much larger errors!
##
## - NOW print your advanced calibration model (see klipper documentation)
##   During printing of the advanced delta calibration model make sure your mesh-leveling is loaded.
##   Calculate and update this configuration with the new values.
##
## - Now repeat Mesh-leveling, Z-probe offset and redo the andvanced delta-calibration and check how close the values are.
##   Remember that backlash and other inaccuracies in the printer can throw these values off a bit so don't worry too much if there
##   are only minor changes compared to the initial calibration.. If you feel a bit extreme just redo the advanced calibration, printing the
##   calibration model each time, until you see the calibration data hovering around the same values over and over.
##
####
[include mainsail.cfg]
#[include adxl.cfg]
[include macros.cfg]

[filament_switch_sensor my_sensor]
switch_pin: !P1.27 # Pin ESTOP-Y for Spider mcu
pause_on_runout: True
runout_gcode: M600  # Move nozzle to a location thats easy for the user to access

#####################################################################
#  Filament change macro M600
#####################################################################
[pause_resume]

[gcode_macro M600]
variable_park_x: 0 # try half your bed size.
variable_park_y: 0
variable_z_lift: 50
variable_velocity: 60
variable_retract: 0.5
gcode:
    SAVE_GCODE_STATE NAME=STATE_M600    # remembers the position
    
    BASE_PAUSE    
    # Fluidd redifines PAUSE to move the the back corner of the printer.  We don't want that.  This is what Fluidd renamed basic pause to. 
    # Mainsail renames PAUSE to "BASE_PAUSE", so you should probably use that instead.  If using other software, probably just use PAUSE.   
    
    # safe park coords
    {% set th = printer.toolhead %}
    {% set park_x = [params.X|default(park_x)|int, th.axis_maximum.x-2]|min %}
    {% set park_y = [params.Y|default(park_y)|int, th.axis_maximum.y-10]|min %}
    {% set park_z = [th.position.z + params.Z_LIFT|default(z_lift)|int, th.axis_maximum.z]|min %}
    {% set park_feedrate = params.VELOCITY|default(velocity)|int * 60 %}
    
    # retract at 50mm/sec
    G91
    G1 E-{retract} F3000
    
    # park toolhead
    G90
    G0 X{park_x} Y{park_y} Z{park_z} F{park_feedrate}
    
    # Tell user to reload filament
    M117 Reload Filament
    
    RESTORE_GCODE_STATE NAME=STATE_M600

# End of gcode script

[delayed_gcode clear_display]
gcode:
  M117



[filament_switch_sensor my_sensor]
pause_on_runout: True
#   When set to True, a PAUSE will execute immediately after a runout
#   is detected. Note that if pause_on_runout is False and the
#   runout_gcode is omitted then runout detection is disabled. Default
#   is True.
#runout_gcode:
#   A list of G-Code commands to execute after a filament runout is
#   detected. See docs/Command_Templates.md for G-Code format. If
#   pause_on_runout is set to True this G-Code will run after the
#   PAUSE is complete. The default is not to run any G-Code commands.
#insert_gcode:
#   A list of G-Code commands to execute after a filament insert is
#   detected. See docs/Command_Templates.md for G-Code format. The
#   default is not to run any G-Code commands, which disables insert
#   detection.
#event_delay: 3.0
#   The minimum amount of time in seconds to delay between events.
#   Events triggered during this time period will be silently
#   ignored. The default is 3 seconds.
#pause_delay: 0.5
#   The amount of time to delay, in seconds, between the pause command
#   dispatch and execution of the runout_gcode. It may be useful to
#   increase this delay if OctoPrint exhibits strange pause behavior.
#   Default is 0.5 seconds.
#switch_pin:
#   The pin on which the switch is connected. This parameter must be
#   provided.

#[firmware_retraction]
#retract_length: 0.8
#retract_speed: 60
#unretract_extra_length: 0
#unretract_speed: 60

[mcu]
serial: /dev/serial/by-id/usb-Klipper_lpc1768_1C300006E0A02DAF7DE73D5BC02000F5-if00


[printer]
## These values need to be calibrated for your printer.
# Incorrect delta_radius value will make your bedleveling concave or convex when reviewing it in octoprint....
kinematics: delta
max_velocity: 300
max_accel: 3000
#max_accel_to_decel: 3000
max_z_velocity: 250
#delta_radius = 227.01
square_corner_velocity: 5.0
minimum_z_position: -1
print_radius: 188

[exclude_object]

[delta_calibrate]
radius: 185.0
speed: 50
# Set to a higher value to prevent the probe from running into bed during initial calibration.
horizontal_move_z: 50

[input_shaper]
shaper_freq_x: 32
shaper_freq_y: 37
shaper_type: mzv


# Stepper A is front left tower
[stepper_a]
step_pin: P0.4
dir_pin: !P0.5
enable_pin: !P4.28
endstop_pin: P1.28

microsteps: 32
rotation_distance: 40
#arm_length: 440.0
homing_speed: 50
second_homing_speed: 5
homing_retract_dist: 25
#angle: 210
#position_endstop: 450.886854

# Stepper B is front right tower
[stepper_b]
step_pin: P2.1
dir_pin: !P2.2
enable_pin: !P2.0
endstop_pin: P1.26

microsteps: 32
rotation_distance: 40
#arm_length: 440.0
homing_speed: 50
second_homing_speed: 5
homing_retract_dist: 25
#angle: 330
#position_endstop: 451.437075

# Stepper C is back tower
[stepper_c]
step_pin: P0.20
dir_pin: !P0.21
enable_pin: !P0.19
endstop_pin: P1.24

microsteps: 32
rotation_distance: 40
#arm_length: 440.0
homing_speed: 50
second_homing_speed: 5
homing_retract_dist: 25
#angle: 90
#position_endstop:  450.197295

[probe]
pin: P1.25
# Z Min Default probe.
# Z-offset is distance between trigger-point of hotend probe and actual hotend. Use klippers documentation for a guide
# on how to calibrate this in a easy way. Do AFTER delta-calibration.
#z_offset: 17.05
speed: 5.0
lift_speed: 10
samples: 6
samples_result: median


# I prefer bicubic due allowing more probe-points... Do MESH leveling AFTER delta-calibration.
[bed_mesh]
mesh_radius: 180
mesh_origin: 0,0
round_probe_count: 11
horizontal_move_z: 50
mesh_pps: 2,2
algorithm: bicubic
speed: 80
fade_start: 1
fade_end: 10
fade_target: 0


[gcode_arcs]
resolution: 0.7


[extruder]
step_pin: P0.11
dir_pin: !P2.13
enable_pin: !P2.12
microsteps: 16
rotation_distance: 6.986
nozzle_diameter: 0.400
pressure_advance: 0.26
filament_diameter: 1.750
heater_pin: P2.7
sensor_type: Generic 3950 #ATC Semitec 104GT-2
sensor_pin: P0.24
max_extrude_only_distance: 500.0
max_extrude_cross_section: 2.56
#control: pid
#pid_Kp: 10.33
#pid_Ki: 0.51
#pid_Kd: 52.79
min_temp: 0
max_temp: 285


#[heater_fan cold_end]
# Temperature controlled cold-end fan.. Only turn on when above 50C...
#pin: P2.4
#heater: extruder
#heater_temp: 50.0

[controller_fan my_controller_fan]
# Temperature controlled cold-end fan.. Only turn on when above 50C...
pin: P2.4
fan_speed: 0.6
heater: extruder
#stepper: extruder
heater_temp: 50.0


#[extruder1]
#step_pin: P0.1
#dir_pin: P0.0
#enable_pin: !P0.10
#heater_pin: P2.4
#sensor_pin: P0.25
#...

[heater_bed]
heater_pin: P2.5
sensor_type: ATC Semitec 104GT-2
sensor_pin: P0.23
#control: pid
#pid_Kp=66.85
#pid_Ki=13.04
#pid_Kd=228.49
min_temp: 0
max_temp: 115

[fan]
pin: P2.3



###############################
# If using dual extruders...
###############################
# [tmc2209 extruder1]
# uart_pin: P1.1
# run_current: 0.600
# hold_current: 0.500
# stealthchop_threshold: 0
##   If true, enable step interpolation (the driver will internally
##   step at a rate of 256 micro-steps). The default is True.
# interpolate: True



########################################
# EXP1 / EXP2 (display) pins
########################################

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=P1.30, EXP1_3=P0.18, EXP1_5=P0.15, EXP1_7=<NC>, EXP1_9=<GND>,
    EXP1_2=P2.11, EXP1_4=P0.16, EXP1_6=<NC>,  EXP1_8=<NC>, EXP1_10=<5V>,
    # EXP2 header
    EXP2_1=P0.17, EXP2_3=P3.26, EXP2_5=P3.25, EXP2_7=P1.31, EXP2_9=<GND>,
    EXP2_2=P0.15, EXP2_4=P1.23, EXP2_6=P0.18, EXP2_8=<RST>, EXP2_10=<NC>
    # Pins EXP2_1, EXP2_6, EXP2_2 are also MISO, MOSI, SCK of bus "ssp0"

# See the sample-lcd.cfg file for definitions of common LCD displays.

[output_pin beeper]
pin: EXP1_1


